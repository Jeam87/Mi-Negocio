<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="title">Cargando...</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial;background:#f5f5f7}
.header{position:sticky;top:0;z-index:20;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 15px;border-bottom:1px solid #eee}
.logo{height:40px;max-width:150px;object-fit:contain}.cats{position:sticky;top:65px;z-index:19;background:#fff;display:flex;gap:8px;padding:10px 12px;overflow:auto;border-bottom:1px solid #eee}
.cat{white-space:nowrap;padding:8px 18px;border-radius:20px;border:1px solid #e0e0e0;font-size:13px;font-weight:700;background:#fff}.cat.active{background:#ff3346;color:#fff;border-color:#ff3346}
.list{padding:8px;padding-bottom:90px}.card{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card .info{padding:14px}.card .name{font-size:16px;line-height:20px;color:#222;font-weight:700}.card .price{color:#ff3346;font-weight:800;margin-top:8px;font-size:19px}
.card .stock{font-size:12px;color:#777;margin-top:5px}.detalle{position:fixed;inset:0;background:#fff;z-index:50;display:none;overflow:auto}.detalle .pad{padding:18px}
.detalle .price{font-size:26px;font-weight:800;margin:10px 0;color:#ff3346}.btn-wa{background:#25D366;color:#fff;border:none;width:100%;padding:15px;border-radius:10px;font-weight:700;font-size:16px}
.desc-label{color:#ff3346;font-weight:800;font-size:12px;margin-top:18px;letter-spacing:.5px}.cart-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 15px;border-top:1px solid #eee;display:flex;justify-content:space-between;align-items:center;z-index:30}
.empty{text-align:center;padding:45px 20px;color:#777;font-weight:700}.error{text-align:center;padding:35px 20px;color:#b00020;font-weight:700}
</style>
</head>
<body>
<div class="header"><img id="logo" class="logo" src="" alt="Logo"><div onclick="mandarPedido()" style="font-size:22px;cursor:pointer">💬</div></div>
<div class="cats" id="cats"></div><div class="list" id="list"></div>
<div class="cart-bar"><div id="cart-info">Carrito vacío</div><button onclick="mandarPedido()" style="background:#25D366;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:700">Pedir WhatsApp</button></div>
<div class="detalle" id="detalle"><div style="padding:12px;cursor:pointer" onclick="document.getElementById('detalle').style.display='none'">← Volver</div>
<div class="pad"><div id="d-name" style="font-size:24px;font-weight:800"></div><div id="d-price" class="price"></div><div id="d-stock" style="color:#777;font-size:13px;margin-bottom:15px"></div>
<button class="btn-wa" onclick="pedirActual()">Agregar y pedir por WhatsApp</button><div class="desc-label">CATEGORÍA</div><div id="d-category" style="font-size:15px;margin-top:8px"></div></div></div>

<script>
/* CONSERVA AQUÍ LAS MISMAS CLAVES DE SUPABASE QUE YA TIENES EN TU TIENDA.
   NO uses la SERVICE_ROLE KEY. */
const SUPABASE_URL="https://txuggnfohyevpvdfxpfu.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4dWdnbmZvaHlldnB2ZGZ4cGZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NjUzOTcsImV4cCI6MjEwNjA0MTM5N30.JkrQv3Vn1u3HOJYDXFYpbgM_v_IK8ox3o6WThACPHFQ";
let WHATSAPP="523521234567";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let productos=[],carrito=[],actual=null,nombreTienda="Mi Tienda";
const tienda_id=new URLSearchParams(location.search).get('id');
let negocioUserId=null;

async function cargarNegocio(){
 const {data,error}=await sb.from('negocios').select('*').eq('id',tienda_id).single();
 if(error) throw new Error("No se pudo cargar el negocio: "+error.message);
 if(!data) throw new Error("No se encontró el negocio.");
 negocioUserId=data.user_id||null;
 nombreTienda=data.nombre_negocio||data.nombre||"Mi Tienda";
 document.getElementById('title').innerText=nombreTienda;
 if(data.logo_url) document.getElementById('logo').src=data.logo_url;
 if(data.whatsapp) WHATSAPP=data.whatsapp;
}

async function cargarProductos(){
 if(!negocioUserId) throw new Error("El negocio no tiene user_id.");
 const {data,error}=await sb.from('products')
  .select('id,user_id,name,price,cost,stock,category,barcode,created_at')
  .eq('user_id',negocioUserId).order('category',{ascending:true}).order('name',{ascending:true});
 if(error) throw new Error("No se pudieron cargar los productos: "+error.message);
 productos=(data||[]).map(p=>({id:p.id,nombre:p.name||"Producto",precio:Number(p.price||0),costo:Number(p.cost||0),stock:p.stock,categoria:p.category||"Otros",barcode:p.barcode||"",created_at:p.created_at}));
 pintarCats();pintarLista(productos);
}

async function init(){
 if(!tienda_id){document.getElementById('list').innerHTML='<div class="error">Falta el identificador de la tienda en la URL.</div>';return;}
 try{await cargarNegocio();await cargarProductos();if(!productos.length)document.getElementById('list').innerHTML='<div class="empty">Todavía no hay productos publicados en esta tienda.</div>';}
 catch(e){console.error(e);document.getElementById('list').innerHTML='<div class="error">No se pudieron cargar los productos.<br><br>'+(e.message||'Error de conexión con la tienda.')+'</div>';}
}

function pintarCats(){
 const unicas=[...new Set(productos.map(x=>x.categoria).filter(Boolean))],cont=document.getElementById('cats');
 if(!unicas.length){cont.innerHTML='';return;}
 cont.innerHTML='<div class="cat active" onclick="filtrar(\'todos\',this)">INICIO</div>';
 unicas.forEach(c=>{const d=document.createElement('div');d.className='cat';d.innerText=String(c).toUpperCase();d.onclick=()=>filtrar(c,d);cont.appendChild(d);});
}
function filtrar(cat,el){document.querySelectorAll('.cat').forEach(e=>e.classList.remove('active'));el.classList.add('active');pintarLista(cat==='todos'?productos:productos.filter(p=>p.categoria===cat));}
function formatoPrecio(n){return Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});}
function pintarLista(arr){
 const c=document.getElementById('list');c.innerHTML='';
 if(!arr.length){c.innerHTML='<div class="empty">No hay productos en esta categoría.</div>';return;}
 arr.forEach(p=>{const card=document.createElement('div');card.className='card';card.onclick=()=>ver(p.id);
 const info=document.createElement('div');info.className='info';const name=document.createElement('div');name.className='name';name.innerText=p.nombre;
 const price=document.createElement('div');price.className='price';price.innerText='$'+formatoPrecio(p.precio);
 const stock=document.createElement('div');stock.className='stock';
 stock.innerText=(p.stock===null||p.stock===undefined||p.stock==='')?'':(Number(p.stock)<=0?'Agotado':'Disponibles: '+p.stock);
 info.append(name,price,stock);card.appendChild(info);c.appendChild(card);});
}
function ver(id){
 const p=productos.find(x=>String(x.id)===String(id));if(!p)return;actual=p;
 document.getElementById('d-name').innerText=p.nombre;document.getElementById('d-price').innerText='$'+formatoPrecio(p.precio);
 document.getElementById('d-stock').innerText=(p.stock===null||p.stock===undefined||p.stock==='')?'':(Number(p.stock)<=0?'Agotado':'Disponibles: '+p.stock);
 document.getElementById('d-category').innerText=p.categoria||'Otros';document.getElementById('detalle').style.display='block';
}
function pedirActual(){
 if(!actual)return;
 if(actual.stock!==null&&actual.stock!==undefined&&actual.stock!==''&&Number(actual.stock)<=0){alert('Este producto está agotado.');return;}
 carrito.push(actual);actualizar();document.getElementById('detalle').style.display='none';mandarPedido();
}
function actualizar(){let total=0;carrito.forEach(it=>total+=Number(it.precio||0));document.getElementById('cart-info').innerText=carrito.length?`Total $${formatoPrecio(total)} (${carrito.length})`:'Carrito vacío';}
function mandarPedido(){
 if(carrito.length===0&&actual){pedirActual();return;}if(carrito.length===0){alert('Agrega un producto primero.');return;}
 const g={};let tot=0;carrito.forEach(it=>{if(g[it.nombre])g[it.nombre].c++;else g[it.nombre]={...it,c:1};});
 let msg=`Hola ${nombreTienda}! Quiero:%0A`;
 for(let k in g){let it=g[k],sub=Number(it.precio||0)*it.c;msg+=`• ${it.nombre} x${it.c} = $${formatoPrecio(sub)}%0A`;tot+=sub;}
 msg+=`%0ATotal: $${formatoPrecio(tot)}`;const numero=String(WHATSAPP||'').replace(/\D/g,'');
 if(!numero){alert('Esta tienda todavía no tiene un número de WhatsApp configurado.');return;}
 window.open(`https://wa.me/${numero}?text=${msg}`,'_blank');
}
init();
</script>
</body>
</html>
