<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tienda</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{
  box-sizing:border-box
}

:root{
  --azul:#1261c9;
  --azul-oscuro:#084a9e;
  --azul-claro:#eaf3ff;
  --rojo:#e53935;
  --rojo-oscuro:#c62828;
  --amarillo:#f7c600;
  --amarillo-claro:#fff8d6;
  --blanco:#ffffff;
  --fondo:#f6f8fc;
  --texto:#172033;
  --gris:#687386;
  --borde:#e4e9f1;
  --sombra:0 5px 20px rgba(18,61,110,.09);
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--fondo);
  color:var(--texto);
  padding-bottom:82px;
}

button,
input,
select,
textarea{
  font:inherit
}

button{
  cursor:pointer
}

/* =========================
   ENCABEZADO
========================= */

.header{
  position:sticky;
  top:0;
  z-index:40;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 15px;
  min-height:66px;
  border-bottom:1px solid var(--borde);
  box-shadow:0 2px 12px rgba(0,0,0,.05)
}

.header > div:first-child{
  min-width:0
}

.logo{
  height:44px;
  max-width:155px;
  object-fit:contain;
  border-radius:10px
}

.store-name{
  font-weight:900;
  font-size:17px;
  color:var(--azul-oscuro);
  max-width:190px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px
}

.icon-btn{
  border:1px solid #dce6f4;
  background:var(--azul-claro);
  color:var(--azul-oscuro);
  border-radius:12px;
  width:43px;
  height:43px;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s
}

.icon-btn:active{
  transform:scale(.94)
}

.cart-icon{
  position:relative
}

.cart-count{
  position:absolute;
  right:-4px;
  top:-5px;
  background:var(--rojo);
  color:#fff;
  border:2px solid #fff;
  border-radius:50%;
  min-width:20px;
  height:20px;
  padding:1px 5px;
  font-size:11px;
  font-weight:900;
  display:none;
  align-items:center;
  justify-content:center
}

/* =========================
   CATEGORÍAS
========================= */

.cats{
  position:sticky;
  top:66px;
  z-index:30;
  background:#fff;
  display:flex;
  gap:8px;
  padding:11px 12px;
  overflow:auto;
  border-bottom:1px solid var(--borde);
  scrollbar-width:none
}

.cats::-webkit-scrollbar{
  display:none
}

.cat{
  white-space:nowrap;
  padding:9px 17px;
  border-radius:22px;
  border:1px solid #d7e1ee;
  background:#fff;
  color:#40516a;
  font-size:12px;
  font-weight:800;
  transition:.2s
}

.cat.active{
  background:var(--azul);
  color:#fff;
  border-color:var(--azul);
  box-shadow:0 4px 10px rgba(18,97,201,.22)
}

/* =========================
   LISTA
========================= */

.list{
  padding:14px 12px 100px;
  max-width:900px;
  margin:auto
}

.card{
  position:relative;
  background:var(--blanco);
  border:1px solid #e8edf4;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:13px;
  box-shadow:var(--sombra);
  transition:.2s
}

.card:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 25px rgba(18,61,110,.13)
}

.card-info{
  padding:17px
}

.card-name{
  font-size:17px;
  line-height:22px;
  font-weight:900;
  color:var(--texto)
}

.card-price{
  margin-top:8px;
  color:var(--rojo);
  font-size:21px;
  font-weight:950
}

.card-stock{
  margin-top:6px;
  color:var(--gris);
  font-size:12px;
  font-weight:600
}

.card-actions{
  display:flex;
  gap:8px;
  margin-top:14px
}

.add-btn{
  flex:1;
  border:0;
  background:var(--azul);
  color:#fff;
  padding:12px;
  border-radius:11px;
  font-weight:900;
  box-shadow:0 4px 10px rgba(18,97,201,.18);
  transition:.2s
}

.add-btn:active{
  transform:scale(.98)
}

.add-btn.disabled{
  background:#d9dee7;
  color:#8993a3;
  cursor:not-allowed;
  box-shadow:none
}

/* =========================
   BARRA INFERIOR
========================= */

.bottom-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:35;
  background:rgba(255,255,255,.98);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--borde);
  padding:10px 13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  box-shadow:0 -4px 18px rgba(0,0,0,.07)
}

.bottom-total{
  font-weight:900;
  font-size:13px;
  color:var(--texto)
}

.checkout-btn{
  border:0;
  background:var(--azul);
  color:#fff;
  padding:12px 17px;
  border-radius:12px;
  font-weight:900;
  box-shadow:0 4px 12px rgba(18,97,201,.22)
}

.checkout-btn:active{
  transform:scale(.98)
}

/* =========================
   MENSAJES
========================= */

.empty,
.error{
  text-align:center;
  padding:55px 20px;
  color:var(--gris);
  font-weight:700
}

.error{
  color:var(--rojo-oscuro);
  background:#fff;
  border-radius:16px;
  margin-top:10px
}

/* =========================
   MODALES
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(8,30,58,.55);
  backdrop-filter:blur(3px);
  display:none;
  align-items:flex-end;
  justify-content:center
}

.modal.open{
  display:flex
}

.modal-box{
  width:100%;
  max-width:650px;
  max-height:94vh;
  overflow:auto;
  background:#fff;
  border-radius:24px 24px 0 0;
  padding:21px;
  box-shadow:0 -10px 35px rgba(0,0,0,.18);
  animation:subirModal .2s ease-out
}

@keyframes subirModal{
  from{
    transform:translateY(25px);
    opacity:.7
  }
  to{
    transform:translateY(0);
    opacity:1
  }
}

.modal-title{
  font-size:22px;
  font-weight:950;
  color:var(--azul-oscuro);
  margin-bottom:17px
}

.close{
  float:right;
  border:0;
  background:#edf3fb;
  color:var(--azul-oscuro);
  border-radius:50%;
  width:37px;
  height:37px;
  font-size:21px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center
}

/* =========================
   DETALLE
========================= */

.detail-name{
  font-size:26px;
  line-height:32px;
  font-weight:950;
  color:var(--texto);
  padding-right:42px
}

.detail-price{
  color:var(--rojo);
  font-size:28px;
  font-weight:950;
  margin:11px 0
}

.detail-stock{
  color:var(--gris);
  font-size:13px;
  margin-bottom:20px;
  font-weight:600
}

/* =========================
   CARRITO
========================= */

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid var(--borde)
}

.cart-item-name{
  font-weight:900;
  color:var(--texto)
}

.cart-item-price{
  font-size:13px;
  color:var(--gris);
  margin-top:5px
}

.qty{
  display:flex;
  align-items:center;
  gap:8px
}

.qty button{
  width:32px;
  height:32px;
  border:1px solid #dce5f1;
  background:var(--azul-claro);
  color:var(--azul-oscuro);
  border-radius:9px;
  font-weight:950
}

.remove{
  border:0;
  background:none;
  color:var(--rojo);
  font-size:12px;
  font-weight:800;
  margin-top:5px;
  padding:0
}

.cart-total{
  display:flex;
  justify-content:space-between;
  font-size:21px;
  font-weight:950;
  margin:20px 0;
  color:var(--texto)
}

/* =========================
   FORMULARIO
========================= */

.field{
  margin-bottom:15px
}

.field label{
  display:block;
  font-size:12px;
  font-weight:900;
  color:#39465b;
  margin-bottom:7px
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid #d9e1ec;
  border-radius:11px;
  padding:13px;
  background:#fff;
  color:var(--texto);
  outline:none;
  transition:.2s
}

.field input::placeholder,
.field textarea::placeholder{
  color:#9aa4b3
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--azul);
  box-shadow:0 0 0 3px rgba(18,97,201,.10)
}

.field textarea{
  min-height:90px;
  resize:vertical
}

/* =========================
   ENTREGA
========================= */

.delivery-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-bottom:15px
}

.delivery-option{
  border:1px solid #d9e1ec;
  border-radius:12px;
  padding:13px 9px;
  text-align:center;
  font-weight:900;
  font-size:13px;
  color:#526078;
  background:#fff;
  transition:.2s
}

.delivery-option.active{
  border-color:var(--azul);
  background:var(--azul-claro);
  color:var(--azul-oscuro);
  box-shadow:0 3px 9px rgba(18,97,201,.10)
}

/* =========================
   PAGO
========================= */

.payment-option{
  border:1px solid #dce3ed;
  border-radius:12px;
  padding:14px;
  margin-bottom:9px;
  display:flex;
  gap:10px;
  align-items:flex-start;
  background:#fff;
  transition:.2s
}

.payment-option:has(input:checked){
  border-color:var(--azul);
  background:var(--azul-claro)
}

.payment-option input{
  margin-top:3px;
  accent-color:var(--azul)
}

.payment-option strong{
  display:block;
  font-size:14px;
  color:var(--texto)
}

.payment-option small{
  display:block;
  color:var(--gris);
  margin-top:4px;
  font-size:11px;
  line-height:16px
}

/* =========================
   BOTÓN PRINCIPAL
========================= */

.main-action{
  width:100%;
  border:0;
  background:var(--azul);
  color:#fff;
  padding:15px;
  border-radius:12px;
  font-weight:950;
  font-size:16px;
  box-shadow:0 5px 13px rgba(18,97,201,.20);
  transition:.2s
}

.main-action:active{
  transform:scale(.99)
}

.main-action:disabled{
  opacity:.6;
  cursor:not-allowed;
  box-shadow:none
}

/* =========================
   WHATSAPP
========================= */

.whatsapp{
  width:100%;
  border:0;
  background:#25d366;
  color:#fff;
  padding:14px;
  border-radius:12px;
  font-weight:950;
  margin-top:9px;
  box-shadow:0 4px 10px rgba(37,211,102,.18)
}

/* =========================
   NOTAS
========================= */

.note{
  background:var(--amarillo-claro);
  border:1px solid #f0d86a;
  border-radius:11px;
  padding:12px;
  color:#685b18;
  font-size:12px;
  line-height:17px;
  margin:13px 0
}

/* =========================
   RESULTADO
========================= */

.success{
  text-align:center;
  padding:28px 10px
}

.success-icon{
  font-size:58px;
  margin-bottom:10px
}

.success h2{
  margin:8px 0;
  font-size:24px;
  font-weight:950;
  color:var(--azul-oscuro)
}

.order-number{
  font-weight:950;
  color:var(--rojo);
  margin:11px 0
}

.hidden{
  display:none!important
}

/* =========================
   CELULAR
========================= */

@media(max-width:480px){

  .header{
    padding:10px 12px
  }

  .store-name{
    font-size:15px;
    max-width:145px
  }

  .logo{
    height:40px;
    max-width:130px
  }

  .list{
    padding-left:10px;
    padding-right:10px
  }

  .card-info{
    padding:15px
  }

  .card-name{
    font-size:16px
  }

  .card-price{
    font-size:20px
  }

  .bottom-total{
    max-width:150px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis
  }

  .checkout-btn{
    padding:11px 14px;
    font-size:13px
  }

  .modal-box{
    padding:18px;
    border-radius:22px 22px 0 0
  }

}

/* =========================
   PANTALLAS GRANDES
========================= */

@media(min-width:700px){

  .list{
    padding-top:20px
  }

  .card{
    margin-bottom:15px
  }

}
  </style>
