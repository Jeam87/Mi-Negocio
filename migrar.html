<!DOCTYPE html><html><body>
<h3>Pasar datos a la nube - V2</h3>
<button id="b" style="background:green;color:white;padding:15px;width:100%">PULSA AQUI PARA SUBIR TODO A SUPABASE</button>
<div id="log"></div>
<script>
const SUPABASE_URL = "https://TU-PROYECTO.supabase.co";
const SUPABASE_KEY = "TU_ANON_KEY";
document.getElementById('b').onclick = async () => {
  let all = {};
  for(let i=0;i<localStorage.length;i++){ let k=localStorage.key(i); all[k]=localStorage.getItem(k); }
  let txt = JSON.stringify(all);
  document.getElementById('log').innerText = "Tienes "+txt.length+" caracteres. Subiendo directo...";
  const res = await fetch(SUPABASE_URL+"/rest/v1/respaldo", {
    method:"POST",
    headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=representation"},
    body: JSON.stringify({email:"esaul_1987@hotmail.com", datos: all})
  });
  let j = await res.text();
  document.getElementById('log').innerText = "Respuesta: "+j;
  if(res.ok) alert("OK LISTO!");
  else alert("Error: "+j);
}
</script>
</body></html>
