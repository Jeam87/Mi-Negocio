<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restablecer contraseña - Mi Negocio 11.5</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#FFF8F0] min-h-screen flex items-center justify-center p-6"><div class="bg-white w-full max-w-md rounded-[28px] p-6 shadow-xl border-2 border-black"><h1 class="font-black text-[24px] text-center">🔑 Nueva contraseña</h1><p class="text-[12px] text-gray-500 text-center mt-2">Escribe tu nueva contraseña para Mi Negocio 11.5.</p><input id="pass1" type="password" placeholder="Nueva contraseña" class="w-full border-2 border-black p-4 rounded-2xl font-bold text-[14px] mt-5"><input id="pass2" type="password" placeholder="Repite la contraseña" class="w-full border-2 border-black p-4 rounded-2xl font-bold text-[14px] mt-3"><button id="btn" onclick="cambiarPassword()" class="w-full mt-4 bg-black text-white py-4 rounded-2xl font-black">CAMBIAR CONTRASEÑA</button><p id="msg" class="hidden mt-4 text-[12px] font-bold text-center p-3 rounded-xl"></p></div><script>function mostrar(t,o){let e=document.getElementById('msg');e.textContent=t;e.className='mt-4 text-[12px] font-bold text-center p-3 rounded-xl '+(o?'bg-green-100 text-green-700':'bg-red-100 text-red-700')}function token(){return new URLSearchParams((location.hash||'').replace(/^#/,'')).get('access_token')||''}async function cambiarPassword(){let p1=document.getElementById('pass1').value,p2=document.getElementById('pass2').value,t=token(),b=document.getElementById('btn');if(!t)return mostrar('El enlace de recuperación no es válido o ya venció. Solicita otro correo.',false);if(p1.length<6)return mostrar('La contraseña debe tener al menos 6 caracteres.',false);if(p1!==p2)return mostrar('Las contraseñas no coinciden.',false);b.disabled=true;b.textContent='GUARDANDO...';try{let r=await fetch('/api/update-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:t,password:p1})}),j=await r.json().catch(()=>({ok:false,msg:'Respuesta inválida del servidor.'}));if(!r.ok||!j.ok){b.disabled=false;b.textContent='CAMBIAR CONTRASEÑA';return mostrar(j.msg||'No se pudo cambiar la contraseña.',false)}mostrar('✅ Contraseña cambiada correctamente. Ya puedes entrar a tu aplicación.',true);b.textContent='CONTRASEÑA CAMBIADA';setTimeout(()=>location.href='/',1800)}catch(e){b.disabled=false;b.textContent='CAMBIAR CONTRASEÑA';mostrar('Error de conexión: '+(e.message||e),false)}}</script></body></html>
